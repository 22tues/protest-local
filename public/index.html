<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountability Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 1rem; }
        input { padding: 10px; font-size: 16px; width: calc(100% - 130px); max-width: 300px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <form action="/" method="GET" style="margin-bottom: 2rem;">
        <input type="text" name="zip" placeholder="Enter ZIP Code" required pattern="[0-9]{5}">
        <button type="submit">Find Targets</button>
    </form>

    <!-- HTMLRewriter takes over here -->
    <div id="results-container">
        <p>Enter a ZIP code to find your federal representatives and their local district offices.</p>
    </div>
</body>
</html>
